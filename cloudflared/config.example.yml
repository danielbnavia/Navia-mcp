# Cloudflare Tunnel configuration for navia-mcp
#
# 1. Create a Cloudflare Tunnel:
#      cloudflared tunnel login
#      cloudflared tunnel create navia-mcp
#    This produces a UUID and writes credentials to ~/.cloudflared/<UUID>.json
# 2. Copy this file to cloudflared/config.yml and replace <TUNNEL_UUID> below.
# 3. Route DNS to the tunnel:
#      cloudflared tunnel route dns navia-mcp navia-mcp.naviafreight.com
# 4. Run the tunnel:
#      cloudflared tunnel --config cloudflared/config.yml run
#
# Or use docker-compose.cloudflare.yml which runs cloudflared as a sidecar
# using TUNNEL_TOKEN instead of the credentials file.

tunnel: <TUNNEL_UUID>
credentials-file: /etc/cloudflared/<TUNNEL_UUID>.json

# Loopback to the local Navia MCP HTTP server (port 88, see PORT default in src/http-server.ts).
ingress:
  - hostname: navia-mcp.naviafreight.com
    service: http://localhost:88
    originRequest:
      noTLSVerify: false
      connectTimeout: 30s
      keepAliveTimeout: 90s
      # Streamable HTTP MCP can hold responses open; bump idle timeouts.
      tcpKeepAlive: 30s
  - service: http_status:404
